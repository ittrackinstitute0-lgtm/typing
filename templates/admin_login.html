{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto my-12">
  <div class="glass-panel rounded-3xl p-8 border border-white/10 shadow-2xl relative overflow-hidden">
    
    <!-- Ambient Glow Background -->
    <div class="absolute -top-10 -right-10 w-40 h-40 bg-purple-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="text-center mb-8">
      <div class="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center text-white text-2xl mb-3 shadow-lg shadow-purple-500/30">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <h1 class="text-2xl font-extrabold text-white tracking-tight">Admin Portal</h1>
      <p class="text-xs text-gray-400 mt-1">Authenticate to manage levels, view logs, and configure curriculum</p>
    </div>

    {% if error %}
    <div class="mb-5 p-3.5 rounded-xl bg-rose-500/15 border border-rose-500/30 text-rose-300 text-xs flex items-center gap-2">
      <i class="fa-solid fa-circle-exclamation text-rose-400"></i>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form method="POST" action="/admin/login" class="space-y-4">
      <div>
        <label for="username" class="block text-xs font-semibold text-gray-300 mb-1.5">Admin Username</label>
        <div class="relative">
          <i class="fa-solid fa-user absolute left-3.5 top-3 text-xs text-gray-500"></i>
          <input type="text" id="username" name="username" value="admin" required placeholder="Enter username" class="w-full pl-9 pr-4 py-2.5 rounded-xl bg-gray-900/90 border border-gray-800 text-white text-xs outline-none focus:border-cyan-400 transition-colors">
        </div>
      </div>

      <div>
        <label for="password" class="block text-xs font-semibold text-gray-300 mb-1.5">Password</label>
        <div class="relative">
          <i class="fa-solid fa-lock absolute left-3.5 top-3 text-xs text-gray-500"></i>
          <input type="password" id="password" name="password" required placeholder="Enter password" class="w-full pl-9 pr-4 py-2.5 rounded-xl bg-gray-900/90 border border-gray-800 text-white text-xs outline-none focus:border-cyan-400 transition-colors">
        </div>
      </div>

      <button type="submit" class="w-full py-3 px-4 rounded-xl text-xs font-bold bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white shadow-lg shadow-purple-600/25 transition-all flex items-center justify-center gap-2 cursor-pointer mt-2">
        <i class="fa-solid fa-arrow-right-to-bracket"></i> Login to Dashboard
      </button>
    </form>

    <!-- Default Credentials Notice -->
    <div class="mt-6 p-3 rounded-xl bg-gray-950/80 border border-gray-800/80 text-[11px] text-gray-400">
      <div class="font-semibold text-gray-300 mb-1 flex items-center gap-1.5">
        <i class="fa-solid fa-key text-cyan-400"></i> Default Credentials:
      </div>
      <div>Username: <span class="font-mono text-cyan-300">admin</span></div>
      <div>Password: <span class="font-mono text-cyan-300">admin123</span></div>
    </div>

    <div class="text-center mt-6">
      <a href="/" class="text-xs text-gray-500 hover:text-gray-300 transition-colors">
        &larr; Back to Practice Arena
      </a>
    </div>

  </div>
</div>
{% endblock %}
